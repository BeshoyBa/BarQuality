<style>
:root{--g:#14482f;--g2:#1f6b45;--r:#b3262e;--paper:#fcfbf6;--line:#d9d4c2;--ink:#1d2a22;--mute:#667064;--sf:Georgia,"Times New Roman",serif;--ss:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#fffdf4 0%,#eff6e7 55%,#fbebe4 100%) fixed;min-height:100vh;color:var(--ink);font-family:var(--ss);font-size:17px;line-height:1.35;padding-bottom:160px}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
header{background:linear-gradient(160deg,#fffef8 0%,#e9f3e0 50%,#f8e0d8 100%);color:var(--ink);text-align:center;padding:24px 18px 20px;border-bottom:5px solid;border-image:linear-gradient(90deg,#2f9a5f 33.3%,#fff 33.3% 66.6%,#c8202b 66.6%) 1}
.lg{touch-action:manipulation;-webkit-tap-highlight-color:transparent;display:block;width:min(80vw,400px);height:auto;margin:0 auto 12px;cursor:default;-webkit-user-select:none;user-select:none}
.logo{font-family:var(--sf);font-style:italic;font-weight:800;font-size:3.4rem;line-height:1;margin:0}
.sub{font-family:var(--sf);letter-spacing:.14em;font-size:.95rem;margin:6px 0 14px}
.tri{height:5px;width:150px;margin:0 auto 16px;background:linear-gradient(90deg,#2f9a5f 33.3%,#fff 33.3% 66.6%,var(--r) 66.6%)}
.tag{font-family:var(--sf);font-style:italic;font-size:1.15rem;margin:0;color:var(--g)}
nav{position:sticky;top:0;z-index:5;background:rgba(255,253,244,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs{display:flex}
.tabs button{flex:1;padding:14px 8px;border:0;background:none;font:700 1.05rem var(--ss);color:var(--mute);border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--g);border-bottom-color:var(--r)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 18px;scrollbar-width:none}
.chips a{flex:none;padding:7px 14px;border:1px solid var(--g);border-radius:99px;color:var(--g);text-decoration:none;font-weight:600;font-size:.95rem;white-space:nowrap}
.chips a:active{background:var(--g);color:#fff}
section{padding-top:26px;scroll-margin-top:112px}
h2{display:flex;align-items:center;gap:10px}
.ic{width:30px;height:30px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
h2{font-family:var(--sf);font-weight:800;color:var(--g);font-size:1.7rem;margin:0 0 4px;padding-bottom:8px;border-bottom:3px double var(--g)}
.it{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dotted var(--line)}
.ib{flex:1;min-width:0}
.pl{width:40px;height:40px;flex:none;border-radius:50%;border:2px solid var(--g);background:#fff;color:var(--g);font:700 1.5rem/1 var(--ss);cursor:pointer;padding:0}
.st{display:flex;align-items:center;gap:6px;background:var(--g);color:#fff;border-radius:99px;padding:3px}
.st button{width:34px;height:34px;border:0;border-radius:50%;background:#fff;color:var(--g);font:700 1.3rem/1 var(--ss);cursor:pointer;padding:0}
.st b{min-width:20px;text-align:center}
.cart{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:8}
body.adm .cart{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
.cartbtn{width:100%;display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border:0;border-radius:14px;background:linear-gradient(135deg,#c8303a,#9e1f27);color:#fff;font:700 1.05rem var(--ss);box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
.sheet{position:fixed;inset:0;z-index:20;background:linear-gradient(180deg,#fffdf4,#eff6e7 60%,#fbebe4);overflow:auto;padding-bottom:40px}
.shh{display:flex;justify-content:space-between;align-items:center;padding:18px 0 8px;border-bottom:3px double var(--g)}
.st2{font:800 1.6rem var(--sf);color:var(--g)}
.cl{border:1px solid var(--g);background:#fff;color:var(--g);border-radius:8px;padding:9px 14px;font:700 .95rem var(--ss);cursor:pointer}
label{display:block;font-weight:600;margin:16px 0 6px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:13px 6px;border:1px solid var(--g);border-radius:10px;background:#fff;color:var(--g);font:700 1rem var(--ss);cursor:pointer}
.seg .on{background:var(--g);color:#fff}
.tt{display:flex;justify-content:space-between;padding:14px 0;font:800 1.3rem var(--sf);color:var(--g)}
.pay{margin:14px 0 0;color:var(--mute)}
.err{color:var(--r);font-weight:600;min-height:1.3em;margin:10px 0 0}
.send{width:100%;padding:16px;border:0;border-radius:14px;background:linear-gradient(135deg,#1f6b45,#0e3a26);color:#fff;font:700 1.1rem var(--ss);cursor:pointer}
.sc{display:inline-block;margin:12px 0 0;padding:8px 16px;border-radius:99px;background:linear-gradient(135deg,#c8303a,#9e1f27);color:#fff;font-weight:700;font-size:.98rem}
.info{display:grid;gap:14px;padding-top:30px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.ctt{font:800 1.2rem var(--sf);color:var(--g);margin:0 0 6px}
.card p{margin:0 0 12px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.lk{display:inline-block;padding:11px 16px;border-radius:99px;background:var(--g);color:#fff;text-decoration:none;font-weight:700}
.lk svg{width:20px;height:20px;vertical-align:-4px;margin-right:7px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ad{display:inline-flex;align-items:center;gap:6px;margin-top:10px;color:var(--g);font-weight:600;text-decoration:none}
.ad svg,.ib2 svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hs{display:flex;justify-content:center;gap:24px;margin-top:14px;flex-wrap:wrap}
.grp{display:flex;flex-direction:column;align-items:center;gap:6px}
.grp>span{font-size:.85rem;color:var(--mute);font-weight:600}
.grp>div{display:flex;gap:10px}
.ib2{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--g);color:#fff;text-decoration:none}
.ib2.al{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.ib2 svg{width:23px;height:23px}
.lead3{margin:18px 0 8px;font-weight:600}
.links.c{justify-content:center}
.lk.al{background:#fff;color:var(--g);border:1px solid var(--g)}
.dgb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.dgc{background:#fff;border-radius:16px;padding:20px;max-width:340px;width:100%}
.dgt{font:800 1.3rem var(--sf);color:var(--g);margin:0 0 8px}
.dgc p{margin:0 0 12px}
.dgr{display:flex;gap:8px;margin-top:14px}
.dgr button{flex:1;padding:13px;border-radius:10px;border:1px solid var(--g);background:#fff;color:var(--g);font:700 1rem var(--ss);cursor:pointer}
.dgr .main{background:var(--g);color:#fff}
.gest{border:0;background:none;color:rgba(255,255,255,.6);font:600 .85rem var(--ss);text-decoration:underline;cursor:pointer;padding:8px}
.dl{margin:12px auto 0;max-width:430px;font-size:.95rem;font-weight:600;color:var(--g);line-height:1.35}
.hint2,.nz{padding:9px 12px;border-radius:12px;font-weight:700;text-align:center;font-size:.93rem}
.hint2{background:#fff;color:var(--g);border:1px solid var(--g);margin-bottom:8px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.nz{margin:12px 0 0;background:#e8f3ea;color:var(--g)}
.sub2{display:flex;justify-content:space-between;padding:6px 0;color:var(--mute)}
.chips2{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{padding:10px 14px;border:1px solid var(--g);border-radius:99px;background:#fff;color:var(--g);font:600 .98rem var(--ss);cursor:pointer}
.chip.on{background:var(--g);color:#fff}
.sheet.pn{z-index:30}
.ag-l{display:inline-block;margin-top:6px;padding:4px 0;border:0;background:none;color:var(--g);font:700 .92rem var(--ss);text-decoration:underline;cursor:pointer}
.agbox:empty{display:none}
.agbox{scroll-margin-bottom:150px}
.agp{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 0 4px}
.agp .pay{margin:0 0 8px;font-size:.92rem}
.chip small{font-weight:600;opacity:.75;margin-left:4px}
.more{border:0;background:none;color:var(--g);font:700 .95rem var(--ss);text-decoration:underline;padding:6px 0;cursor:pointer}
.agt{display:flex;justify-content:space-between;align-items:center;margin:8px 0 0;font-weight:700;color:var(--g)}
.agok{width:100%;margin-top:8px;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,#1f6b45,#0e3a26);color:#fff;font:700 1rem var(--ss);cursor:pointer}
.ck{display:flex;align-items:center;gap:10px;font-weight:600;margin:16px 0 6px}
.ck input{width:22px;height:22px;flex:none}
.fin{text-align:center;padding-top:60px}.ok{width:96px;height:96px}.lead2{font-size:1.15rem;line-height:1.5;margin:10px 0 26px}.send.alt{background:#fff;color:var(--g);border:2px solid var(--g);margin-top:12px}.fin .cl{margin-top:16px}
.hint{color:var(--mute);font-size:.9rem;text-align:center}

.row{display:flex;align-items:baseline;gap:8px}
.nm{font-weight:700;font-size:1.08rem}
.lead{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:12px}
.pr{font-weight:700;font-size:1rem;color:var(--r);margin-left:8px;white-space:nowrap}
.ds{color:var(--mute);font-size:.95rem;margin-top:2px}
footer{text-align:center;margin-top:40px;padding:26px 18px;background:linear-gradient(135deg,#0e3a26,#1f6b45);color:#fff}
footer p{margin:0 0 6px}
footer a{color:#fff;font-family:var(--sf);font-weight:800;font-size:1.8rem;text-decoration:none}
/* modifica */
.ed{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0}
.ed .row{gap:8px}

d.onclick=function(e){var b=e.target.closest("[data-d]");if(!b)return;var v=i?i.value:"";d.innerHTML="";d.onclick=null;if(b.dataset.d==="ok")cb(v)}}
function pinDlg(cb){pinCb=cb;var el=document.getElementById("pin");el.innerHTML='<div class="sheet pn"><div class="wrap fin"><p class="st2">Gestione</p><p class="lead2">Inserisci il PIN</p><input id="pin-i" type="password" inputmode="numeric" autocomplete="off" style="max-width:220px;text-align:center;font-size:1.4rem"><p class="err" id="pin-e"></p><button class="send" data-a="pgo">Entra</button><button class="cl" data-a="pcl" style="margin-top:14px">Annulla</button></div></div>';document.body.style.overflow="hidden";var i=document.getElementById("pin-i");if(i&&i.focus)i.focus()}
function pinClose(){document.getElementById("pin").innerHTML="";document.body.style.overflow=open?"hidden":""}
function pinGo(){var v=String(document.getElementById("pin-i").value||"").trim();if(v===pinVal()){var f=pinCb;pinClose();if(f)f()}else{var e=document.getElementById("pin-e");if(e)e.textContent="PIN sbagliato"}}
document.getElementById("pin").addEventListener("click",function(e){var b=e.target.closest("[data-a]");if(!b)return;if(b.dataset.a==="pgo")pinGo();else if(b.dataset.a==="pcl")pinClose()});
document.getElementById("pin").addEventListener("keydown",function(e){if(e.key==="Enter")pinGo()});
function num(v,d){var n=parseFloat(String(v==null?"":v).replace(",","."));return isNaN(n)?d:n}
function cfg(){var I=S.info||{};return{c:num(I.cons_costo,1),f:num(I.cons_gratis,30),g:num(I.cons_omaggio,40),s:num(I.stud_pct,10)}}
function fmt(n){return n%1===0?String(n):n.toFixed(2).replace(".",",")}
function fin(x){var k=cfg(),fee=0,d=F.stud?Math.round(x.t*k.s)/100:0;if(F.modo==="consegna")fee=(k.f>0&&x.t>=k.f)?0:k.c;return{fee:fee,disc:d,gift:k.g>0&&x.t>=k.g,total:Math.round((x.t-d+fee)*100)/100}}
function nudge(x){var k=cfg(),m;
if(F.modo==="consegna"&&k.f>0&&x.t<k.f){m=Math.round((k.f-x.t)*100)/100;return m<=12?"Aggiungi "+eur(m)+" € e la consegna è gratis":""}
if(k.g>0&&x.t<k.g){m=Math.round((k.g-x.t)*100)/100;return m<=12?"Mancano "+eur(m)+" € per una margherita in omaggio":""}
return""}
function dl(){var k=cfg(),p=[];if(k.c>0){p.push("Consegna a Voghera "+fmt(k.c)+" €");if(k.f>0)p.push("gratis da "+fmt(k.f)+" €")}else p.push("Consegna a Voghera gratuita");if(k.g>0)p.push("da "+fmt(k.g)+" € una margherita in omaggio");return'<p class="dl">'+p.join(" · ")+'</p>'}
